rumble.download.platform.explain.unreadable=%1$s respondió, pero no se pudo leer su versión, así que no se sabe si los bots de %2$s pueden iniciarse aquí.
rumble.download.platform.explain.npm_missing=Node.js está en este equipo, pero npm no. Los bots de %2$s necesitan npm para obtener su Bot API al iniciarse. Instala Node.js %4$s o posterior con npm desde su página oficial.
rumble.download.platform.explain.no_environment=Los bots de %2$s necesitan la Python Bot API. Esta pantalla puede crear un entorno de Python propio para ellos en la carpeta de descargas e instalar en él la Python Bot API del propio programa. No se cambia nada más en este equipo. La instalación necesita la red.
rumble.download.platform.explain.no_venv=%1$s %3$s está en este equipo, pero no puede crear un entorno de Python, así que no se puede preparar la Python Bot API para los bots de %2$s.
