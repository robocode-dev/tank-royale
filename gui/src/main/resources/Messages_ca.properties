rumble.download.platform.explain.missing=No s'ha trobat %1$s en aquest ordinador, així que els bots de %2$s no es poden iniciar. Instal·la %1$s %4$s o posterior des de la seva pàgina oficial.
rumble.download.platform.explain.too_old=Aquest ordinador té %1$s %3$s, i el Rumble admet %1$s %4$s o posterior. És possible que els bots de %2$s no s'iniciïn fins que instal·lis una versió més nova des de la seva pàgina oficial.
rumble.download.platform.explain.unreadable=%1$s ha respost, però no s'ha pogut llegir la seva versió, així que no se sap si els bots de %2$s es poden iniciar aquí.
rumble.download.platform.explain.npm_missing=Node.js és en aquest ordinador, però npm no. Els bots de %2$s necessiten npm per obtenir la seva Bot API quan s'inicien. Instal·la Node.js %4$s o posterior amb npm des de la seva pàgina oficial.
rumble.download.platform.explain.no_environment=Els bots de %2$s necessiten la Python Bot API. Aquesta pantalla pot crear un entorn de Python propi per a ells a la carpeta de baixades i instal·lar-hi la Python Bot API del mateix programa. No es canvia res més en aquest ordinador. La instal·lació necessita la xarxa.
rumble.download.platform.explain.no_venv=%1$s %3$s és en aquest ordinador, però no pot crear un entorn de Python, així que no es pot preparar la Python Bot API per als bots de %2$s.
