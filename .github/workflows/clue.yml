# The corpus wall: the same released clue that runs locally judges every PR
# and push to main. Job name `validate` is the intended required status check
# under branch protection.
#
# This file is a thin caller. The validation logic — checkout, changed-surface
# detection, the plain-change boundary, checksum verification, binary staging,
# `clue validate --forbid-changes`, and the acceptance-brief gate — lives in
# Cliewen's reusable workflow, so upstream fixes arrive by updating one
# reference instead of by re-copying steps. Only the triggers below and the
# four inputs are ours to choose.
#
# `clue-source: release` downloads the binary from the pinned Cliewen release
# and verifies it against that release's own SHA256SUMS; this repository
# vendors no clue binary. An empty `clue-install-directory` stages the verified
# executable under RUNNER_TEMP, so the run needs no root-writable path.
#
# The reference is a full commit SHA rather than a release tag because the
# reusable workflow was added upstream after v0.10.0 and is not yet part of a
# release. Move it to the release tag once a Cliewen release contains
# .github/workflows/clue-validation.yml. Both forms are immutable; a branch
# reference is not, and must not be used here.
#
# The `edited` trigger and the upstream unit's fetch-depth 0 are load-bearing:
# the acceptance-brief gate must re-run when a pull-request body changes, and
# change detection needs the base commit.
name: Clue

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    uses: cliewen/cliewen/.github/workflows/clue-validation.yml@8c406d59f5166026c2db17261af8713e33efd0bc
    with:
      runner: '["ubuntu-latest"]'
      clue-version: 0.10.0
      clue-source: release
      clue-install-directory: ''
