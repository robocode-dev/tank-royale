# The corpus wall: the same released clue that runs locally judges every PR
# and push to main. Job name `validate` is the intended required status check
# under branch protection.
#
# This file is a thin caller. The validation logic — checkout, changed-surface
# detection, route-aware checksum verification, binary staging,
# `clue validate --forbid-changes`, and the full-loop acceptance-brief gate — lives in
# Cliewen's reusable workflow, so upstream fixes arrive by updating one
# reference instead of by re-copying steps. Only the triggers below and the
# five inputs are ours to choose.
#
# `clue-source: release` downloads the binary from the pinned Cliewen release
# and verifies it against that release's own SHA256SUMS; this repository
# vendors no clue binary. An empty `clue-install-directory` stages the verified
# executable under RUNNER_TEMP, so the run needs no root-writable path.
#
# The reference is a full commit SHA, and that SHA is the commit Cliewen's
# v0.20.0 tag names — the release whose binary `clue-version` below asks for,
# so the reusable workflow and the binary it runs come from one revision. Keep
# the SHA form when moving the pin: a tag is a pointer its owner can re-aim,
# while a SHA names one tree forever. A branch reference must never be used
# here.
#
# The `edited` and `ready_for_review` triggers and the upstream unit's fetch-depth
# 0 are load-bearing: the acceptance-brief gate must re-run when a pull-request
# body changes or a draft becomes a merge candidate, and change detection needs
# the base commit. With those triggers in place, `draft-aware` lets unfinished
# drafts retain their transient change workspace without weakening the ready or
# main-branch gate.
name: Clue

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    uses: cliewen/cliewen/.github/workflows/clue-validation.yml@5dcdf973b849dd816c3d310e2a29c88941d1174a
    with:
      runner: '["ubuntu-latest"]'
      clue-version: 0.22.0
      clue-source: release
      clue-install-directory: ''
      draft-aware: true
