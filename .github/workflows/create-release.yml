name: Create Release

on:
  workflow_dispatch:

# Needed for creating releases and uploading assets and dispatching packaging workflow
permissions:
  contents: write
  actions: write

jobs:
  create-release:
    name: Gradle create-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # Wrapper validation occasionally fails due to network timeouts connecting to
      # Cloudflare CDN (ETIMEDOUT/ENETUNREACH). Using continue-on-error to prevent
      # blocking the build while still attempting validation for security.
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
        timeout-minutes: 3
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Get version from Gradle
        id: get-version
        run: |
          VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate dated changelog entry
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          TOP_ENTRY=$(grep -m 1 '^## \[' CHANGELOG.md || true)
          if [[ "$TOP_ENTRY" =~ ^##\ \[$VERSION\]\ -\ ([0-9]{4}-[0-9]{2}-[0-9]{2})\ -\ .+$ ]]; then
            RELEASE_DATE="${BASH_REMATCH[1]}"
          else
            echo "::error::CHANGELOG.md must start with a dated release entry for $VERSION: ## [$VERSION] - YYYY-MM-DD - Short release title. Replace Unreleased before creating a release."
            exit 1
          fi

          if [[ "$(date -u -d "$RELEASE_DATE" '+%F' 2>/dev/null)" != "$RELEASE_DATE" ]]; then
            echo "::error::CHANGELOG.md release date must be a valid calendar date: $RELEASE_DATE"
            exit 1
          fi

          echo "Validated changelog entry: $TOP_ENTRY"

      - name: Run Gradle create-release (create draft release)
        run: |
          ./gradlew --no-daemon create-release \
            -PtankRoyaleGitHubToken=${{ secrets.GITHUB_TOKEN }}

  package-release:
    name: Call package-release workflow
    needs: create-release
    uses: ./.github/workflows/package-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit
