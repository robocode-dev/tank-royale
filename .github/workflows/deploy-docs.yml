name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['web/**', 'bot-api/**', 'runner/**', 'gradle/libs.versions.toml', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8 (for Docfx)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.4

      - name: Add dotnet global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup Python (for Sphinx)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build all docs (VitePress + API references)
        run: ./gradlew upload-docs --no-daemon --stacktrace

      # The API doc generators skip silently when their toolchain is missing or has
      # nothing to read, which used to publish a site with 404s while the run stayed
      # green. Fail here instead, before anything reaches Pages.
      - name: Verify every API reference was generated
        run: |
          missing=0
          for page in java/index.html \
                      dotnet/index.html \
                      dotnet/api/Robocode.TankRoyale.BotApi.html \
                      python/index.html \
                      typescript/index.html \
                      runner/index.html; do
            if [ ! -s "docs/api/$page" ]; then
              echo "::error::Missing or empty API reference page: docs/api/$page"
              missing=$((missing + 1))
            else
              echo "OK  docs/api/$page"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing API reference page(s) missing - refusing to deploy an incomplete site"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
